services:
  mandelbrot:
    build: .
    expose:
      - "8000"
    networks:
      - private

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - mandelbrot
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - private

networks:
  private: